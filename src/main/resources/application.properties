
spring.application.name=civicpulse-ai
server.port=8080

# Database Configuration (MySQL 8)
spring.datasource.url=jdbc:mysql://localhost:3306/civicpulse_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
civicpulse.upload.dir=uploads

# AI Processing Configuration
gemini.api.key=${GEMINI_API_KEY:}
civicpulse.ai.mode=hybrid
