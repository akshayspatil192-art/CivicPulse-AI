services:
  - type: web
    name: civicpulse-ai
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    disk:
      name: civicpulse-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CIVICPULSE_UPLOAD_DIR
        value: /var/data/uploads